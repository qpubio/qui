name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  verify-build-artifacts:
    name: Verify Build Artifacts
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist artifacts exist
        run: |
          test -f dist/index.js || (echo "Main CJS bundle missing" && exit 1)
          test -f dist/index.mjs || (echo "Main ESM bundle missing" && exit 1)
          test -f dist/index.d.ts || (echo "Main type definitions missing" && exit 1)
          test -f dist/globals.css || (echo "globals.css missing" && exit 1)
          test -f dist/tailwind-preset.js || (echo "Tailwind preset CJS missing" && exit 1)
          test -f dist/tailwind-preset.mjs || (echo "Tailwind preset ESM missing" && exit 1)
          test -f dist/tailwind-preset.d.ts || (echo "Tailwind preset types missing" && exit 1)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-node-20
          path: dist/
          retention-days: 7
